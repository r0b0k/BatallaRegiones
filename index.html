<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Batalla de Regiones Pokémon | Arena Táctica v4</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#0f172a}
h1,h2,.fd{font-family:'Fredoka',sans-serif}
.btn{transition:transform .1s,box-shadow .1s;box-shadow:0 4px 0 rgba(15,23,42,.25)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(15,23,42,.25)}
.btn:disabled{opacity:.6}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .28s ease-out forwards}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
  <div class="max-w-5xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 shrink-0 rounded-full bg-red-600 border-[3px] border-slate-900 relative flex items-center justify-center">
        <div class="w-full h-1 bg-slate-900 absolute"></div><div class="w-2.5 h-2.5 rounded-full bg-white border-2 border-slate-900 z-10"></div>
      </div>
      <h1 class="font-bold text-base sm:text-xl truncate">BATALLA DE REGIONES <span class="text-red-600">POKÉMON</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-2 bg-slate-100 px-2.5 py-1.5 rounded-xl border border-slate-200">
        <button onclick="toggleAudio()" id="btn-sound" title="Sonido">🔊</button>
        <input type="range" min="0" max="100" value="55" oninput="audio.vol=this.value/100" class="w-14 sm:w-20 accent-red-600" aria-label="Volumen" />
        <button onclick="toggleMusic()" id="btn-music" class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg bg-slate-200 hover:bg-slate-300">🎵 ON</button>
      </div>
      <button onclick="openRanking()" class="btn px-3 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 font-extrabold text-sm">🏆<span class="hidden sm:inline"> Ranking</span></button>
    </div>
  </div>
</header>

<!-- CONFIGURACIÓN -->
<main id="setup" class="max-w-5xl mx-auto px-3 sm:px-6 py-5">
  <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
      <div class="flex flex-wrap items-center gap-2">
        <select id="mode" onchange="onMode()" class="bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-sm font-extrabold" aria-label="Modo">
          <option value="duel">⚔️ Duelo (2 regiones)</option>
          <option value="royal">👑 Batalla campal (4 regiones)</option>
          <option value="tournament">🏆 Torneo (4 regiones)</option>
          <option value="mixed">🧬 Equipos mixtos</option>
        </select>
        <select id="filter" onchange="saveCfg()" class="bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-sm font-bold" aria-label="Filtro">
          <option value="all">Todos los Pokémon</option>
          <option value="nolegend">🚫 Sin legendarios</option>
          <option value="bst500">⚖️ Tope competitivo (BST ≤ 520)</option>
          <option value="final">🔥 Pesos pesados (BST ≥ 470)</option>
        </select>
      </div>
      <label class="flex items-center gap-2 cursor-pointer bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
        <input type="checkbox" id="eq" checked onchange="saveCfg()" class="w-4 h-4 accent-emerald-600" />
        <span class="text-xs font-extrabold text-emerald-800">⚖️ Igualar equipos</span>
      </label>
    </div>
    <div id="slots" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button onclick="randomize()" class="btn px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-sm">🎲 Regiones al azar</button>
        <div id="banner" class="hidden text-xs font-extrabold text-amber-800 bg-amber-100 border border-amber-300 px-3 py-2 rounded-xl"></div>
      </div>
      <button id="btn-start" onclick="start()" class="btn w-full sm:w-auto px-8 py-3 rounded-2xl bg-red-600 hover:bg-red-500 text-white fd font-bold text-base">
        ⚔️ <span id="start-txt">¡INICIAR BATALLA!</span>
      </button>
    </div>
    <div id="loading" class="hidden pt-2 border-t border-slate-100">
      <div class="flex justify-between text-xs font-bold text-slate-600 mb-1"><span>Descargando datos oficiales…</span><span id="lpct">0%</span></div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div id="lbar" class="h-full bg-gradient-to-r from-blue-500 via-red-500 to-amber-400" style="width:0%"></div></div>
    </div>
    <p class="text-xs text-slate-400">La batalla se abre en pantalla completa. Atajos: Espacio = pausa · Esc = salir.</p>
  </section>
</main>

<!-- PANTALLA DE BATALLA (100%) -->
<div id="battle" class="hidden fixed inset-0 z-50 bg-slate-100 select-none overflow-hidden">
  <canvas id="cv" class="absolute inset-0 w-full h-full block cursor-crosshair"></canvas>
  <div class="absolute top-0 inset-x-0 p-2 flex items-start justify-between gap-2 pointer-events-none">
    <div id="hud" class="flex flex-wrap gap-1.5"></div>
    <div class="bg-slate-900/85 text-white rounded-xl px-3 py-1 text-center">
      <div id="timer" class="fd font-bold text-amber-400 tabular-nums">0.0s</div>
      <div id="wx" class="text-[10px] font-bold text-cyan-300 empty:hidden"></div>
    </div>
    <div class="flex gap-1.5 pointer-events-auto">
      <button id="bspd" onclick="cycleSpeed()" class="w-10 h-9 rounded-xl bg-slate-900/85 text-white text-xs font-extrabold" title="Velocidad">1x</button>
      <button id="bpause" onclick="togglePause()" class="w-10 h-9 rounded-xl bg-slate-900/85 text-white" title="Pausa (Espacio)">⏸</button>
      <button onclick="exitBattle()" class="w-10 h-9 rounded-xl bg-rose-600 text-white font-bold" title="Salir (Esc)">✕</button>
    </div>
  </div>
  <div id="domb" class="absolute bottom-0 inset-x-0 h-1.5 flex"></div>
  <div id="slow" class="hidden pointer-events-none absolute bottom-6 inset-x-0 text-center"><span id="slow-txt" class="bg-red-600/95 text-white fd font-bold text-xs px-4 py-1.5 rounded-full"></span></div>

  <div id="insp" class="hidden absolute bottom-4 left-3 bg-slate-900/95 text-white rounded-2xl p-3 w-60 pop">
    <div class="flex items-center gap-2">
      <img id="i-img" src="" alt="" class="w-11 h-11 bg-slate-800 rounded-xl p-1" />
      <div class="min-w-0 flex-1"><div id="i-name" class="fd font-bold text-sm truncate"></div><div id="i-info" class="text-[11px] text-slate-300"></div></div>
      <button onclick="clearInsp()" class="text-slate-400 hover:text-white text-xs" aria-label="Cerrar">✕</button>
    </div>
    <div class="h-2 bg-slate-800 rounded-full overflow-hidden mt-2"><div id="i-bar" class="h-full bg-emerald-400" style="width:100%"></div></div>
    <div class="flex justify-between text-[11px] mt-1.5"><span id="i-hp" class="text-slate-300"></span><span id="i-st"></span></div>
  </div>

  <div id="victory" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-xl w-full p-5 text-center pop my-auto">
      <h2 id="v-title" class="text-2xl sm:text-3xl font-bold uppercase"></h2>
      <p id="v-stats" class="text-sm font-semibold text-slate-500 mt-1"></p>
      <div id="v-top" class="mt-4 flex justify-center gap-2 flex-wrap"></div>
      <div class="mt-5 flex flex-wrap justify-center gap-2.5">
        <button id="btn-next" onclick="nextBattle()" class="btn px-5 py-3 rounded-2xl bg-red-600 hover:bg-red-500 text-white fd font-bold">⚔️ Revancha</button>
        <button onclick="shareCard()" class="btn px-4 py-3 rounded-2xl bg-slate-900 text-white font-bold text-sm">📸 <span id="share-lbl">Guardar imagen</span></button>
        <button onclick="openRanking()" class="btn px-4 py-3 rounded-2xl bg-amber-400 font-extrabold text-sm">🏆 Ranking</button>
        <button onclick="exitBattle()" class="btn px-4 py-3 rounded-2xl bg-slate-200 font-extrabold text-sm">⚙️ Configurar</button>
      </div>
    </div>
  </div>
</div>

<!-- RANKING -->
<div id="rank" class="hidden fixed inset-0 bg-slate-950/75 z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[88vh] flex flex-col pop">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
      <div><h3 class="fd font-bold text-xl">🏆 Ranking histórico</h3><p class="text-xs text-slate-500">Menor índice = victoria más dominante.</p></div>
      <button onclick="closeRanking()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold" aria-label="Cerrar">✕</button>
    </div>
    <div class="p-3 overflow-y-auto flex-1">
      <table class="w-full text-left text-sm font-semibold">
        <thead><tr class="text-[11px] text-slate-400 border-b-2 border-slate-100"><th class="p-2">#</th><th class="p-2">Campeón</th><th class="p-2">Formato</th><th class="p-2">Tiempo</th><th class="p-2">Vivos</th><th class="p-2">MVP</th><th class="p-2 text-right">Índice</th></tr></thead>
        <tbody id="rk-body" class="divide-y divide-slate-100"></tbody>
      </table>
      <p id="rk-empty" class="hidden text-center py-10 text-slate-400 text-sm">Aún no hay combates registrados.</p>
    </div>
    <div class="p-3 bg-slate-50 rounded-b-3xl flex justify-between">
      <button onclick="clearRanking()" class="text-xs font-bold text-rose-600 px-3 py-1.5 rounded-lg hover:bg-rose-50">🗑️ Limpiar</button>
      <button onclick="closeRanking()" class="btn px-5 py-2 rounded-xl bg-slate-900 text-white font-bold text-sm">Cerrar</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const spr=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const REG={kanto:['Kanto',1,151,[1,4,7]],johto:['Johto',152,251,[152,155,158]],hoenn:['Hoenn',252,386,[252,255,258]],sinnoh:['Sinnoh',387,493,[387,390,393]],unova:['Unova',494,649,[495,498,501]],kalos:['Kalos',650,721,[650,653,656]],alola:['Alola',722,809,[722,725,728]],galar:['Galar',810,898,[810,813,816]],paldea:['Paldea',906,1025,[906,909,912]]};
const GEN=['I','II','III','IV','V','VI','VII','VIII','IX'];
const LEG=new Set([144,145,146,150,151,243,244,245,249,250,251,377,378,379,380,381,382,383,384,385,386,480,481,482,483,484,485,486,487,488,489,490,491,492,493,494,638,639,640,641,642,643,644,645,646,647,648,649,716,717,718,719,720,721,785,786,787,788,789,790,791,792,800,801,802,807,808,809,888,889,890,891,892,893,894,895,896,897,898,905,1001,1002,1003,1004,1007,1008,1014,1015,1016,1017,1024,1025]);
const TES={normal:'Normal',fire:'Fuego',water:'Agua',electric:'Eléctrico',grass:'Planta',ice:'Hielo',fighting:'Lucha',poison:'Veneno',ground:'Tierra',flying:'Volador',psychic:'Psíquico',bug:'Bicho',rock:'Roca',ghost:'Fantasma',dragon:'Dragón',dark:'Siniestro',steel:'Acero',fairy:'Hada'};
const TC={normal:'#A8A77A',fire:'#EE8130',water:'#6390F0',electric:'#F7D02C',grass:'#7AC74C',ice:'#96D9D6',fighting:'#C22E28',poison:'#A33EA1',ground:'#E2BF65',flying:'#A98FF3',psychic:'#F95587',bug:'#A6B91A',rock:'#B6A136',ghost:'#735797',dragon:'#6F35FC',dark:'#705746',steel:'#B7B7CE',fairy:'#D685AD'};
const SK={fire:['Llamarada Ígnea',75,'burn'],electric:['Chispa Paralizante',72,'para'],grass:['Síntesis Vital',68,'heal'],water:['Hidropulso',72,'aoe'],ice:['Ventisca Helada',74,'aoe'],fighting:['Puño Certero',80,'pierce'],steel:['Cabeza de Hierro',76,'pierce'],dragon:['Cometa Draco',85,'aoe'],fairy:['Brillo Mágico',75,'heal'],psychic:['Psicocarga',76,'pierce'],poison:['Bomba Lodo',65,'burn'],ground:['Terremoto',78,'aoe'],rock:['Avalancha',72,'aoe'],ghost:['Bola Sombra',74,'pierce'],dark:['Pulso Umbrío',72,'para'],flying:['Tajo Aéreo',68,'para'],bug:['Zumbido',62,'heal'],normal:['Golpe Cuerpo',60,'para']};
const CH={normal:{rock:.5,ghost:0,steel:.5},fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},electric:{water:2,electric:.5,grass:.5,ground:0,flying:2,dragon:.5},grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5,steel:.5},ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2,steel:2},flying:{electric:.5,grass:2,fighting:2,bug:2,rock:.5,steel:.5},psychic:{fighting:2,poison:2,psychic:.5,dark:0,steel:.5},bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},ghost:{normal:0,psychic:2,ghost:2,dark:.5},dragon:{dragon:2,steel:.5,fairy:0},dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},steel:{fire:.5,water:.5,electric:.5,ice:2,rock:2,steel:.5,fairy:2},fairy:{fire:.5,fighting:2,poison:.5,dragon:2,dark:2,steel:.5}};
const TEAMS=[{h:'#2563eb',s:'●',c:'blue'},{h:'#e11d48',s:'▲',c:'rose'},{h:'#059669',s:'■',c:'emerald'},{h:'#d97706',s:'◆',c:'amber'}];
const eff=(a,d)=>d.reduce((m,t)=>m*(CH[a]&&CH[a][t]!==undefined?CH[a][t]:1),1);

/* ---------- AUDIO ---------- */
const audio={on:true,music:true,vol:.55,ctx:null,iv:null,step:0};
function initAudio(){if(!audio.ctx)audio.ctx=new(window.AudioContext||window.webkitAudioContext)();if(audio.ctx.state==='suspended')audio.ctx.resume()}
function tone(f,type='sine',d=.09,g=1){if(!audio.on||audio.vol<=0)return;try{initAudio();const c=audio.ctx,o=c.createOscillator(),n=c.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(.08*audio.vol*g,c.currentTime);n.gain.exponentialRampToValueAtTime(.0008,c.currentTime+d);o.connect(n);n.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function toggleAudio(){audio.on=!audio.on;$('btn-sound').textContent=audio.on?'🔊':'🔇'}
function toggleMusic(){audio.music=!audio.music;$('btn-music').textContent=audio.music?'🎵 ON':'🎵 OFF';audio.music?(sim.running&&startMusic()):stopMusic()}
function startMusic(){stopMusic();if(!audio.music)return;const b=[110,110,130.81,146.83,110,110,164.81,146.83],h=[220,261.63,293.66,329.63,220,293.66,349.23,392];audio.iv=setInterval(()=>{if(!sim.running||sim.paused)return;const s=sim.slowOn?h:b;tone(s[audio.step++%8],sim.slowOn?'sawtooth':'triangle',.16,.45)},240)}
function stopMusic(){clearInterval(audio.iv);audio.iv=null}

/* ---------- DATOS (con caché local) ---------- */
const cache=new Map(),sprites=new Map();
try{JSON.parse(localStorage.getItem('pk_cache_v1')||'[]').forEach(([k,v])=>cache.set(k,v))}catch(e){}
const OVR={'nidoran-f':'Nidoran♀','nidoran-m':'Nidoran♂','mr-mime':'Mr. Mime','ho-oh':'Ho-Oh','type-null':'Código Cero'};
const fmt=n=>OVR[n]||n.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
function sprite(id){if(!sprites.has(id)){const i=new Image();i.crossOrigin='anonymous';i.src=spr(id);sprites.set(id,i)}return sprites.get(id)}
async function fetchPoke(id){
  if(cache.has(id)){sprite(id);return cache.get(id)}
  let p;
  try{const d=await(await fetch('https://pokeapi.co/api/v2/pokemon/'+id)).json();const s={};d.stats.forEach(x=>s[x.stat.name]=x.base_stat);
    p={id:d.id,name:fmt(d.name),types:d.types.map(t=>t.type.name),hp:s.hp,atk:s.attack,def:s.defense,spa:s['special-attack'],spd:s['special-defense'],spe:s.speed};
    p.bst=p.hp+p.atk+p.def+p.spa+p.spd+p.spe;cache.set(id,p)}
  catch(e){p={id,name:'Pokémon #'+id,types:['normal'],hp:65,atk:65,def:65,spa:65,spd:65,spe:65,bst:390}}
  p.leg=LEG.has(p.id);sprite(id);return p}
async function loadRoster(key,filter,prog){
  const [,a,b]=REG[key],ids=[];for(let i=a;i<=b;i++)ids.push(i);const out=[];
  for(let i=0;i<ids.length;i+=30){const r=await Promise.all(ids.slice(i,i+30).map(fetchPoke));out.push(...r);prog(r.length)}
  return out.filter(p=>!(filter==='nolegend'&&p.leg)&&!(filter==='bst500'&&p.bst>520)&&!(filter==='final'&&p.bst<470))}

/* ---------- CONFIGURACIÓN ---------- */
const opts=Object.keys(REG).map((k,i)=>`<option value="${k}">${REG[k][0]} (Gen ${GEN[i]})</option>`).join('');
$('slots').innerHTML=TEAMS.map((t,i)=>`<div id="slot-${i}" class="bg-${t.c}-50 border-2 border-${t.c}-200 rounded-2xl p-3 flex flex-col gap-2"><div class="flex justify-between text-xs font-extrabold text-${t.c}-700"><span>${t.s} Equipo ${i+1}</span><span id="cnt-${i}"></span></div><select id="sel-${i}" onchange="renderPreviews();saveCfg()" class="w-full bg-white border border-${t.c}-300 rounded-xl px-3 py-2 font-bold text-sm" aria-label="Región equipo ${i+1}">${opts}</select><div id="pv-${i}" class="flex justify-around border-t border-${t.c}-200 pt-2"></div></div>`).join('');
const tour={active:false,round:0,regions:[],finalists:[]};
function renderPreviews(){
  const m=$('mode').value,n=(m==='royal'||m==='tournament')?4:2;
  for(let i=0;i<4;i++){const c=$('slot-'+i);c.classList.toggle('hidden',i>=n);if(i>=n)continue;
    const r=REG[$('sel-'+i).value];$('cnt-'+i).textContent=(r[2]-r[1]+1)+' Poké';
    $('pv-'+i).innerHTML=r[3].map(s=>`<img src="${spr(s)}" class="w-11 h-11 object-contain" alt="" loading="lazy" />`).join('')}}
function onMode(){
  const t=$('mode').value==='tournament';tour.active=t;tour.round=0;tour.finalists=[];
  $('banner').classList.toggle('hidden',!t);$('banner').textContent='🏆 Semifinal 1 (Equipo 1 vs Equipo 2)';
  $('start-txt').textContent=t?'JUGAR SEMIFINAL 1':'¡INICIAR BATALLA!';renderPreviews();saveCfg()}
function randomize(){const k=Object.keys(REG).sort(()=>Math.random()-.5);for(let i=0;i<4;i++)$('sel-'+i).value=k[i];renderPreviews();saveCfg()}
function saveCfg(){try{localStorage.setItem('pk_cfg',JSON.stringify({m:$('mode').value,f:$('filter').value,e:$('eq').checked,r:[0,1,2,3].map(i=>$('sel-'+i).value)}))}catch(e){}}
function loadCfg(){
  const defs=['kanto','johto','hoenn','sinnoh'];[0,1,2,3].forEach(i=>$('sel-'+i).value=defs[i]);
  try{const c=JSON.parse(localStorage.getItem('pk_cfg')||'null');if(c){$('mode').value=c.m;$('filter').value=c.f;$('eq').checked=c.e;c.r.forEach((v,i)=>$('sel-'+i).value=v)}}catch(e){}
  onMode()}

/* ---------- ESTADO Y PANTALLA ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0;
const sim={running:false,paused:false,speed:1,t:0,last:0,F:[],proj:[],parts:[],texts:[],heals:[],kills:[],weather:'clear',wt:11,cam:{x:0,y:0,z:1,tx:0,ty:0,tz:1},insp:null,slowOn:false,names:[],keys:[],pend:null,showT:0};
function resizeCanvas(){const d=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d}
function openBattle(){$('battle').classList.remove('hidden');document.body.style.overflow='hidden';
  if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});resizeCanvas()}
function exitBattle(){sim.running=false;sim.paused=false;stopMusic();$('battle').classList.add('hidden');$('victory').classList.add('hidden');document.body.style.overflow='';
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function nextBattle(){exitBattle();start()}

function arenaEvent(){
  if(Math.random()<.35){sim.heals.push({x:W*(.25+Math.random()*.5),y:H*(.25+Math.random()*.5),r:52,life:9});$('wx').textContent='💚 Zona curativa'}
  else{const w=[['sun','☀️ Sol (+Fuego)'],['rain','🌧️ Lluvia (+Agua)'],['storm','⚡ Tormenta (+Eléctrico)'],['clear','']][Math.floor(Math.random()*4)];sim.weather=w[0];$('wx').textContent=w[1]}}
function pickTarget(a,en){
  if(!en.length)return null;let best=null,bs=-Infinity;
  for(const e of en){const d=Math.hypot(e.x-a.x,e.y-a.y);
    const s=a.ai==='nearest'?-d:(a.ai==='weakest'?(1-e.hp/e.maxHp)*140:(eff(a.types[0],e.types)-1)*120)-d*.35;
    if(s>bs){bs=s;best=e}}
  return best}
function attack(a,t,en,al){
  let bt=a.types[0],bm=eff(bt,t.types);
  if(a.types[1]){const m=eff(a.types[1],t.types);if(m>bm){bt=a.types[1];bm=m}}
  const sp=a.scd<=0,sk=a.skill;if(sp)a.scd=5.5;
  const stab=bt===a.types[0]?1.5:1.25,wm=(sim.weather==='sun'&&bt==='fire')||(sim.weather==='rain'&&bt==='water')||(sim.weather==='storm'&&bt==='electric')?1.3:1;
  let df=Math.max(t.def,t.spd);if(sp&&sk[2]==='pierce')df*=.65;
  const dmg=Math.max(5,Math.round(Math.max(a.atk,a.spa)/df*(sk[1]*(sp?1.22:1)*.35)*stab*bm*wm*(.9+Math.random()*.2)));
  const col=TC[bt]||'#38bdf8',fx=sp?sk[2]:null;
  if(a.role==='sniper')sim.proj.push({x:a.x,y:a.y,t,a,dmg,m:bm,col,fx,en,al});else hit(a,t,dmg,bm,col,fx,en,al)}
function hit(a,t,dmg,m,col,fx,en,al){
  if(!t.alive)return;hurt(a,t,dmg,m,col);if(!fx)return;
  if(fx==='burn')t.burn=3;else if(fx==='para')t.para=2.2;
  else if(fx==='heal'){const h=Math.round(dmg*.45);a.hp=Math.min(a.maxHp,a.hp+h);for(const o of al)if(o.alive&&o!==a&&Math.hypot(o.x-a.x,o.y-a.y)<75)o.hp=Math.min(o.maxHp,o.hp+Math.round(h*.6))}
  else if(fx==='aoe')for(const e of en)if(e.alive&&e!==t&&Math.hypot(e.x-t.x,e.y-t.y)<68)hurt(a,e,Math.round(dmg*.55),1,col)}
function hurt(a,t,dmg,m,col){
  if(!t.alive)return;t.hp-=dmg;t.flash=.14;const an=Math.atan2(t.y-a.y,t.x-a.x);t.x+=Math.cos(an)*4;t.y+=Math.sin(an)*4;
  for(let i=0;i<5;i++){const g=Math.random()*6.283,s=28+Math.random()*65;sim.parts.push({x:t.x,y:t.y,vx:Math.cos(g)*s,vy:Math.sin(g)*s,life:.32,col:col||'#f59e0b'})}
  if(sim.slowOn||(sim.insp&&sim.insp.uid===t.uid))sim.texts.push({x:t.x,y:t.y-18,txt:'-'+dmg,col:m>=2?'#dc2626':'#334155',life:.65});
  if(t.hp<=0){t.hp=0;t.alive=false;a.kills++;sim.kills.push(sim.t);tone(m>=2?540:300,'triangle',.09,.7)}}
function focus(sv){

    if(n.length>=2&&n.length<=6&&tm>=2){const s=tm*10-n.length;if(s>bs){bs=s;best=n}}}

  o.fillStyle='#38bdf8';o.font='800 22px sans-serif';o.fillText(`⭐ MVP: ${last.mvp} (${last.mvpKills} KO)`,36,245);
  const im=sprite(last.mvpId);if(im.complete&&im.naturalWidth)o.drawImage(im,460,120,140,140);
  const a=document.createElement('a');a.download='batalla-'+last.winner.toLowerCase().replace(/\s+/g,'-')+'.png';
  try{a.href=c.toDataURL('image/png');a.click();$('share-lbl').textContent='✅ Guardada'}catch(e){$('share-lbl').textContent='No se pudo guardar'}
  setTimeout(()=>$('share-lbl').textContent='Guardar imagen',2500)}
function openRanking(){
  let l=[];try{l=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
  $('rk-empty').classList.toggle('hidden',l.length>0);
  $('rk-body').innerHTML=l.map((r,i)=>`<tr><td class="p-2 font-extrabold">${['🥇','🥈','🥉'][i]||i+1}</td><td class="p-2 text-blue-600 font-extrabold">${r.winner}</td><td class="p-2 text-slate-500">${r.format}</td><td class="p-2 tabular-nums">${r.time}s</td><td class="p-2">${r.survivors}</td><td class="p-2">${r.mvp}</td><td class="p-2 text-right font-extrabold text-amber-600 tabular-nums">${r.score}</td></tr>`).join('');
  $('rank').classList.remove('hidden')}
function closeRanking(){$('rank').classList.add('hidden')}
function clearRanking(){localStorage.removeItem(KEY);openRanking()}

loadCfg();
</script>
