Galar:"Cinderace,fi,,80,116,75,65,75,119;Inteleon,wa,,70,85,65,125,65,120;Rillaboom,gr,,100,125,90,60,70,85;Corviknight,fl,st,98,87,105,53,85,67;Dragapult,dr,gh,88,120,75,100,75,142;Toxtricity,el,po,75,98,70,114,70,75;Grimmsnarl,da,fa,95,120,65,95,75,60;Hatterene,ps,fa,57,90,95,136,103,29;Sirfetchd,fg,,62,135,95,68,82,65;Copperajah,st,,122,130,69,80,69,30;Frosmoth,ic,bu,70,65,60,125,90,65;Duraludon,st,dr,70,95,115,120,50,85",
Paldea:"Meowscarada,gr,da,76,110,70,81,70,123;Skeledirge,fi,gh,104,75,100,110,75,66;Quaquaval,wa,fg,85,120,80,85,75,85;Annihilape,fg,gh,110,115,80,50,90,90;Kingambit,da,st,100,135,120,60,85,50;Baxcalibur,dr,ic,115,145,92,75,86,87;Gholdengo,st,gh,87,60,95,133,91,84;Garganacl,ro,,100,100,130,45,90,35;Tinkaton,fa,st,85,75,77,70,105,94;Armarouge,fi,ps,85,60,100,125,80,75;Lokix,bu,da,71,102,78,52,55,92;Pawmot,el,fg,70,115,70,70,60,105"};
const ROS={};for(const k in R)ROS[k]=R[k].split(';').map(s=>{const a=s.split(',');return{name:a[0],t:[a[1],a[2]].filter(Boolean),bhp:+a[3],atk:+a[4],def:+a[5],spa:+a[6],spd:+a[7],spe:+a[8]}});
const TC={no:'#A8A77A',fi:'#EE8130',wa:'#6390F0',el:'#F7D02C',gr:'#7AC74C',ic:'#96D9D6',fg:'#C22E28',po:'#A33EA1',gd:'#E2BF65',fl:'#A98FF3',ps:'#F95587',bu:'#A6B91A',ro:'#B6A136',gh:'#735797',dr:'#6F35FC',da:'#705746',st:'#B7B7CE',fa:'#D685AD'};
const TN={no:'Normal',fi:'Fuego',wa:'Agua',el:'Eléctrico',gr:'Planta',ic:'Hielo',fg:'Lucha',po:'Veneno',gd:'Tierra',fl:'Volador',ps:'Psíquico',bu:'Bicho',ro:'Roca',gh:'Fantasma',dr:'Dragón',da:'Siniestro',st:'Acero',fa:'Hada'};
const SE={fi:'gr ic bu st',wa:'fi gd ro',el:'wa fl',gr:'wa gd ro',ic:'gr gd fl dr',fg:'no ic ro da st',po:'gr fa',gd:'fi el po ro st',fl:'gr fg bu',ps:'fg po',bu:'gr ps da',ro:'fi ic fl bu',gh:'ps gh',dr:'dr',da:'ps gh',st:'ic ro fa',fa:'fg dr da'};
const NV={fi:'fi wa ro dr',wa:'wa gr dr',el:'el gr dr',gr:'fi gr po fl bu dr st',ic:'fi wa ic st',fg:'po fl ps bu fa',po:'po gd ro gh',gd:'gr bu',fl:'el ro st',ps:'ps st',bu:'fi fg po fl gh st fa',ro:'fg gd st',gh:'da',dr:'st',da:'fg da fa',st:'fi wa el st',fa:'fi po st',no:'ro st'};
const IM={no:'gh',el:'gd',fg:'gh',po:'st',gd:'fl',ps:'da',gh:'no',dr:'fa'};
const eff=(a,ds)=>{let m=1;for(const d of ds){if((IM[a]||'').includes(d))return 0;if((SE[a]||'').split(' ').includes(d))m*=2;else if((NV[a]||'').split(' ').includes(d))m*=.5}return m};
const SK={fi:['Llamarada',75,'burn'],el:['Chispa',72,'para'],gr:['Síntesis',68,'heal'],wa:['Hidropulso',72,'aoe'],ic:['Ventisca',74,'aoe'],fg:['Puño Certero',80,'pierce'],st:['Cabeza de Hierro',76,'pierce'],dr:['Cometa Draco',85,'aoe'],fa:['Brillo Mágico',75,'heal'],ps:['Psicocarga',76,'pierce'],po:['Bomba Lodo',65,'burn'],gd:['Terremoto',78,'aoe'],ro:['Avalancha',72,'aoe'],gh:['Bola Sombra',74,'pierce'],da:['Pulso Umbrío',72,'para'],fl:['Tajo Aéreo',68,'para'],bu:['Zumbido',62,'heal'],no:['Golpe Cuerpo',60,'para']};
const TS=[{n:'Azul',c:'#2563eb'},{n:'Rojo',c:'#e11d48'},{n:'Verde',c:'#059669'},{n:'Ámbar',c:'#d97706'}];
const HPX=3,W=360,H=500,KEY='pkbattle_v4_rank';
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let snd=true,AC=null,UID=0,G=null,mem=[];
const $=id=>document.getElementById(id);

/* ===== UI de configuración ===== */
const names=Object.keys(ROS),defs=['Kanto','Johto','Hoenn','Sinnoh'];
$('regs').innerHTML=[0,1,2,3].map(i=>`<div id="rc${i}"><div style="font-size:11px;font-weight:700;color:${TS[i].c}">● Equipo ${i+1}</div><select id="rs${i}">${names.map(n=>`<option${n===defs[i]?' selected':''}>${n}</option>`).join('')}</select></div>`).join('');
function modeCh(){const n=+$('mode').value;[2,3].forEach(i=>$('rc'+i).style.display=n==4?'':'none')}modeCh();
$('stype').innerHTML=Object.keys(TN).map(k=>`<option value="${k}">${TN[k]}</option>`).join('');function selCh(){$('stype').style.display=$('sel').value=='type'?'':'none'}
function toSetup(){if(G)G.run=false;$('ov').style.display='none';$('game').style.display='none';$('setup').style.display=''}
function beep(f,d=.08){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ===== Creación de combatientes ===== */
function role(p){const b=p.bhp+p.def+p.spd;if(p.spe>=95&&p.spe>=p.spa)return'speedster';if(p.spa>=90&&p.spa>p.atk)return'sniper';if(b>=245)return'tank';return p.spa>p.atk?'sniper':'speedster'}
function mk(p,team,n,x,y){const r=role(p);
 if(x==null){if(n==2){x=team?W-35-Math.random()*W*.25:35+Math.random()*W*.25;y=35+Math.random()*(H-70)}else{x=W*(team%2?.8:.2)+(Math.random()-.5)*W*.22;y=H*(team<2?.2:.8)+(Math.random()-.5)*H*.2}}
 const mh=Math.round(HPX*(p.bhp*2.3+95)*(r=='tank'?1.38:r=='sniper'?.92:1)),ai=['nearest','advantage','weakest'];
 return{...p,uid:++UID,team,role:r,x,y,mh,cur:mh,alive:1,k:0,cd:Math.random(),sk:3+Math.random()*3,burn:0,burnBy:null,para:0,fl:0,ev:0,
  rad:r=='tank'?14:11,rng:r=='sniper'?130:r=='speedster'?32:30,ai:r=='sniper'?'advantage':ai[(p.bhp+p.atk)%3],skill:SK[p.t[0]],
  sp:(34+p.spe*.4)*(r=='speedster'?1.25:r=='tank'?.82:1)*.6}}

/* ===== Inicio ===== */
/* ===== Sprites y carga desde PokéAPI (con respaldo embebido si no hay red) ===== */
const SPC={};function spr(id){if(!SPC[id]){const i=new Image();i.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+id+'.png';SPC[id]=i}return SPC[id]}
const POOL={};let FALL=false;
const RG={Kanto:[1,151],Johto:[152,251],Hoenn:[252,386],Sinnoh:[387,493],Unova:[494,649],Kalos:[650,721],Alola:[722,809],Galar:[810,898],Paldea:[906,1025]};
const TK={normal:'no',fire:'fi',water:'wa',electric:'el',grass:'gr',ice:'ic',fighting:'fg',poison:'po',ground:'gd',flying:'fl',psychic:'ps',bug:'bu',rock:'ro',ghost:'gh',dragon:'dr',dark:'da',steel:'st',fairy:'fa'};
const MW=new Set(['nidoran','mr','ho','porygon','type','jangmo','hakamo','kommo','tapu','iron','roaring','walking','raging','gouging','great','scream','brute','flutter','slither','sandy','wo','chien','ting','chi']);
const cap=s=>s[0].toUpperCase()+s.slice(1);
async function load(k){if(POOL[k])return POOL[k];let out=[];
 try{const[a,b]=RG[k],ids=[];for(let i=a;i<=b;i++)ids.push(i);
  for(let i=0;i<ids.length;i+=30){const r=await Promise.all(ids.slice(i,i+30).map(async id=>{const d=await(await fetch('https://pokeapi.co/api/v2/pokemon/'+id)).json(),s={};d.stats.forEach(x=>s[x.stat.name]=x.base_stat);const pt=d.name.split('-');return{id:d.id,name:MW.has(pt[0])?pt.map(cap).join(' '):cap(pt[0]),t:d.types.map(x=>TK[x.type.name]),bhp:s.hp,atk:s.attack,def:s.defense,spa:s['special-attack'],spd:s['special-defense'],spe:s.speed}}));out.push(...r)}
 }catch(e){out=ROS[k].slice();FALL=true}
 POOL[k]=out;return out}
function pickTeam(pool,md,ty){let p=pool.slice();const bst=x=>x.bhp+x.atk+x.def+x.spa+x.spd+x.spe;
 if(md==='type')p=p.filter(x=>x.t.includes(ty));
 if(md==='bst')p.sort((a,b)=>bst(b)-bst(a));else p.sort(()=>Math.random()-.5);
 return p.slice(0,md==='12'?12:md==='20'?20:30)}
async function start(){const b=document.querySelector('#setup .p');
 const n=+$('mode').value,keys=[0,1,2,3].slice(0,n).map(i=>$('rs'+i).value),md=$('sel').value,ty=$('stype').value;
 $('ov').style.display='none';b.disabled=true;b.textContent='Cargando Pokémon…';FALL=false;
 const pools=await Promise.all(keys.map(load));
 let rs=pools.map(p=>pickTeam(p,md,ty));const m=Math.min(...rs.map(r=>r.length));
 b.disabled=false;b.textContent='¡INICIAR BATALLA!';
 if(!m){toSetup();b.textContent='Sin Pokémon de ese tipo en alguna región: cambia el filtro';return}
 rs=rs.map(r=>r.slice(0,m));rs.forEach(r=>r.forEach(p=>p.id&&spr(p.id)));
 start0(rs);if(FALL)$('info').textContent='⚠️ PokéAPI no disponible: usando 12 Pokémon embebidos por región, sin sprites.'}
function start0(rosters){
 const n=+$('mode').value,keys=[0,1,2,3].slice(0,n).map(i=>$('rs'+i).value);
 $('setup').style.display='none';$('ov').style.display='none';$('game').style.display='';
 const F=[];keys.forEach((k,t)=>rosters[t].forEach(p=>F.push(mk(p,t,n))));
 G={run:true,t:0,F,P:[],PT:[],FT:[],Z:[],wx:'clear',wxT:10,en:40,armed:null,focus:null,keys,n,last:performance.now(),end:0,slow:false,sel:null,lastDead:0,kt:[],tot:rosters.map(r=>r.length)};
 setAb();$('info').textContent='Toca un Pokémon para ver su ficha.';
 requestAnimationFrame(loop);
}

/* ===== Habilidades del Entrenador (Equipo 1) ===== */
const COST={heal:30,focus:20,reinf:40,wx:25};
function setAb(){for(const k in COST)$('b-'+k).disabled=!G||G.en<COST[k];['heal','focus'].forEach(k=>$('b-'+k).classList.toggle('on',G&&G.armed===k))}
function arm(k){if(!G||G.en<COST[k])return;G.armed=G.armed===k?null:k;$('info').textContent=G.armed?(k=='heal'?'Toca el mapa para crear la zona curativa.':'Toca un enemigo para fijarlo como objetivo.'):'';setAb()}
function reinf(){if(!G||G.en<COST.reinf)return;const l=POOL[G.keys[0]]||ROS[G.keys[0]],p=l[Math.floor(Math.random()*l.length)];G.F.push(mk(p,0,G.n,30,60+Math.random()*(H-120)));G.tot[0]++;G.en-=COST.reinf;ft(40,H/2,'¡Refuerzo!','#2563eb');beep(660)}
function wxCast(){if(!G||G.en<COST.wx)return;G.en-=COST.wx;G.wx=['sun','rain','storm'][Math.floor(Math.random()*3)];G.wxT=14;beep(440)}
cv.addEventListener('click',e=>{if(!G||!G.run)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 const near=(f)=>{let b=null,bd=34;for(const o of G.F){if(!o.alive||!f(o))continue;const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;b=o}}return b};
 if(G.armed==='heal'&&G.en>=COST.heal){G.Z.push({x,y,r:55,life:7,team:0});G.en-=COST.heal;G.armed=null;beep(520)}
 else if(G.armed==='focus'&&G.en>=COST.focus){const t=near(o=>o.team!==0);if(t){G.focus={uid:t.uid,t:6};G.en-=COST.focus;G.armed=null;beep(600)}}
 else{G.sel=near(()=>true)}
 setAb()});

/* ===== Combate ===== */
function ft(x,y,t,c){G.FT.push({x,y,t,c,life:.9})}
function hurt(att,tg,d,col,silent,mult){
 if(!tg.alive)return;tg.cur-=d;if(!silent){tg.fl=.12;for(let i=0;i<4;i++){const a=Math.random()*6.28,s=20+Math.random()*40;G.PT.push({x:tg.x,y:tg.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3,c:col})}
  if(G.slow)ft(tg.x,tg.y-12,'-'+Math.round(d),mult>=2?'#dc2626':'#475569')}
 if(tg.cur<=0){tg.cur=0;tg.alive=0;G.lastDead=tg.team;beep(mult>=2?540:300);
  if(att&&att!==tg){att.k++;G.kills=(G.kills||0)+1;G.kt.push(G.t);feed(att,tg);if(att.k===3&&!att.ev)evolve(att)}}}
function evolve(f){f.ev=1;f.mh=Math.round(f.mh*1.3);f.cur=Math.min(f.mh,f.cur+f.mh*.4);f.atk=Math.round(f.atk*1.25);f.spa=Math.round(f.spa*1.25);f.rad+=2;f.name+=' ★';f.fl=.5;ft(f.x,f.y-18,'¡Evoluciona!','#f59e0b');beep(880,.2)}
function feed(a,v){G.feedL=G.feedL||[];G.feedL.unshift(`${a.name} eliminó a ${v.name}`);G.feedL=G.feedL.slice(0,3);G.feedT=3}
function resolve(a,t,d,m,col,eff2,E,A){if(!t.alive)return;hurt(a,t,d,col,false,m);
 if(eff2==='burn'){t.burn=3;t.burnBy=a}else if(eff2==='para')t.para=2.2;
 else if(eff2==='heal'){const h=Math.round(d*.45);a.cur=Math.min(a.mh,a.cur+h);for(const o of A)if(o.alive&&o!==a&&Math.hypot(o.x-a.x,o.y-a.y)<60)o.cur=Math.min(o.mh,o.cur+h*.6)}
 else if(eff2==='aoe')for(const e of E)if(e.alive&&e!==t&&Math.hypot(e.x-t.x,e.y-t.y)<55)hurt(a,e,Math.round(d*.55),col,false,1)}
function pick(a,E){if(!E.length)return null;if(a.team===0&&G.focus){const f=E.find(e=>e.uid===G.focus.uid);if(f)return f}
 let b=null,bs=-1e9;for(const e of E){const d=Math.hypot(e.x-a.x,e.y-a.y);let s=-d*.35;if(a.ai==='nearest')s=-d;else if(a.ai==='weakest')s+=(1-e.cur/e.mh)*140;else s+=(eff(a.t[0],e.t)-1)*120;if(s>bs){bs=s;b=e}}return b}
function attack(a,t,E,A){let bt=a.t[0],bm=eff(bt,t.t);if(a.t[1]){const m2=eff(a.t[1],t.t);if(m2>bm){bt=a.t[1];bm=m2}}
 const sp=a.sk<=0,sk=a.skill;if(sp)a.sk=5.5;
 const stab=bt===a.t[0]?1.5:1.25;let wx=1;if((G.wx=='sun'&&bt=='fi')||(G.wx=='rain'&&bt=='wa')||(G.wx=='storm'&&bt=='el'))wx=1.3;
 let df=Math.max(t.def,t.spd);if(sp&&sk[2]==='pierce')df*=.65;
 const d=Math.max(4,Math.round(Math.max(a.atk,a.spa)/df*(sk[1]*(sp?1.22:1)*.35)*stab*bm*wx*(.9+Math.random()*.2)));
 const col=TC[bt],ef=sp?sk[2]:null;
 if(a.role==='sniper')G.P.push({x:a.x,y:a.y,t,a,d,m:bm,col,ef,E,A});else resolve(a,t,d,bm,col,ef,E,A)}

function step(raw){
 const g=G,alive=g.F.filter(f=>f.alive),n=alive.length;
 if(g.end>0){g.end-=raw;if(g.end<=0){g.run=false;finish()}return}
 const A=g.keys.map((_,i)=>alive.filter(f=>f.team===i)),live=A.filter(a=>a.length);
 if(live.length<=1){g.end=1.6;g.win=live.length?A.indexOf(live[0]):g.lastDead;return}
 g.slow=n<=8;const dt=Math.min(raw,.05)*(n<=4?.4:n<=8?.6:1);g.t+=dt;
 g.en=Math.min(100,g.en+4*dt);
 if(g.focus){g.focus.t-=dt;if(g.focus.t<=0)g.focus=null}
 g.wxT-=dt;if(g.wxT<=0){const r=Math.random();if(r<.4){const tm=A.reduce((b,a,i)=>a.length<A[b].length?i:b,0);g.Z.push({x:W*(.25+Math.random()*.5),y:H*(.25+Math.random()*.5),r:50,life:8,team:tm})}else g.wx=['sun','rain','storm','clear'][Math.floor(Math.random()*4)];g.wxT=14}
 for(let i=g.Z.length-1;i>=0;i--){const z=g.Z[i];z.life-=dt;if(z.life<=0){g.Z.splice(i,1);continue}for(const f of alive)if(f.team===z.team&&Math.hypot(f.x-z.x,f.y-z.y)<z.r)f.cur=Math.min(f.mh,f.cur+30*dt)} /* FIX: solo cura aliados del dueño de la zona */
 for(const f of alive){if(!f.alive)continue;
  f.fl-=dt;f.cd-=dt;f.sk-=dt;f.para-=dt;
  if(f.burn>0){f.burn-=dt;hurt(f.burnBy,f,33*dt,'#f97316',true,1);if(!f.alive)continue} /* FIX: la quemadura cuenta KO */
  const E=alive.filter(o=>o.alive&&o.team!==f.team),t=pick(f,E);
  if(t){const dx=t.x-f.x,dy=t.y-f.y,d=Math.hypot(dx,dy)||1,an=Math.atan2(dy,dx),sm=f.para>0?.45:1;
   if(f.role==='sniper'&&d<f.rng*.7){f.x-=Math.cos(an)*f.sp*.55*sm*dt;f.y-=Math.sin(an)*f.sp*.55*sm*dt}
   else if(d>f.rng*.88){const s=f.role==='speedster'?Math.sin(g.t*6+f.bhp)*.4:0;f.x+=Math.cos(an+s)*f.sp*sm*dt;f.y+=Math.sin(an+s)*f.sp*sm*dt}
   if(d<=f.rng&&f.cd<=0){attack(f,t,E,A[f.team]);f.cd=Math.max(.5,(1.35-f.spe/220)*(f.para>0?1.5:1))}}
  for(const o of A[f.team]){if(o===f||!o.alive)continue;const sx=f.x-o.x,sy=f.y-o.y,sd=Math.hypot(sx,sy),ms=(f.rad+o.rad)*.9;if(sd>0&&sd<ms){const p=(ms-sd)*2*dt;f.x+=sx/sd*p;f.y+=sy/sd*p}}
  f.x=Math.max(16,Math.min(W-16,f.x));f.y=Math.max(16,Math.min(H-16,f.y))}
 for(let i=g.P.length-1;i>=0;i--){const p=g.P[i];if(!p.t.alive){g.P.splice(i,1);continue}const dx=p.t.x-p.x,dy=p.t.y-p.y,d=Math.hypot(dx,dy);if(d<10){resolve(p.a,p.t,p.d,p.m,p.col,p.ef,p.E,p.A);g.P.splice(i,1)}else{p.x+=dx/d*260*dt;p.y+=dy/d*260*dt}}
 for(let i=g.PT.length-1;i>=0;i--){const p=g.PT[i];p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.life-=dt)<=0)g.PT.splice(i,1)}
 for(let i=g.FT.length-1;i>=0;i--){const p=g.FT[i];p.y-=20*dt;if((p.life-=dt)<=0)g.FT.splice(i,1)}
 if(g.feedT>0&&(g.feedT-=dt)<=0)g.feedL=[];
 /* HUD */
 g.hudS=g.keys.map((k,i)=>`<span style="color:${TS[i].c}">● ${k} ${A[i].length}/${g.tot[i]}</span>`).join('')+`<span>⏱ ${g.t.toFixed(1)}s</span><span>${{sun:'☀️ Sol',rain:'🌧 Lluvia',storm:'⚡ Tormenta',clear:'🌤 Despejado'}[g.wx]}</span>`+(g.slow?'<span style="background:#dc2626;color:#fff">🎬 CÁMARA LENTA</span>':'');
 $('hud').innerHTML=g.hudS;$('en').style.width=g.en+'%';setAb();
 if(g.sel&&g.sel.alive){const s=g.sel;$('info').textContent=`${s.name} · ${s.t.map(x=>TN[x]).join('/')} · ${s.role} · ${s.skill[0]} · PS ${Math.round(s.cur)}/${s.mh} · ${s.k} KO${s.burn>0?' · 🔥':s.para>0?' · ⚡':''}`}
 else if(g.feedL&&g.feedL.length)$('info').textContent=g.feedL[0]}

/* ===== Render ===== */
function draw(){const g=G;cx.clearRect(0,0,W,H);cx.strokeStyle='rgba(148,163,184,.5)';cx.lineWidth=2;cx.strokeRect(8,8,W-16,H-16);cx.beginPath();cx.moveTo(W/2,8);cx.lineTo(W/2,H-8);cx.stroke();cx.beginPath();cx.arc(W/2,H/2,45,0,7);cx.stroke();
 for(const z of g.Z){cx.beginPath();cx.arc(z.x,z.y,z.r,0,7);cx.fillStyle='rgba(16,185,129,.16)';cx.fill();cx.strokeStyle=TS[z.team].c;cx.setLineDash([5,4]);cx.stroke();cx.setLineDash([])}
 cx.textAlign='center';
 for(const f of g.F){if(!f.alive)continue;const r=f.rad;
  if(g.focus&&g.focus.uid===f.uid){cx.beginPath();cx.arc(f.x,f.y,r+8,0,7);cx.strokeStyle='#ef4444';cx.lineWidth=2;cx.stroke()}
  if(g.sel===f){cx.beginPath();cx.arc(f.x,f.y,r+6,0,7);cx.strokeStyle='#0ea5e9';cx.lineWidth=2;cx.stroke()}
  cx.beginPath();cx.arc(f.x,f.y,r+2.5,0,7);cx.strokeStyle=f.burn>0?'#f97316':f.para>0?'#eab308':TS[f.team].c;cx.lineWidth=3;cx.stroke();
  const im=f.id?spr(f.id):null,ok=!!(im&&im.complete&&im.naturalWidth);if(ok){const s=r*2+14;cx.save();cx.translate(f.x,f.y);if(f.team%2===0)cx.scale(-1,1);cx.drawImage(im,-s/2,-s/2,s,s);cx.restore();if(f.fl>0){cx.beginPath();cx.arc(f.x,f.y,r,0,7);cx.fillStyle='rgba(255,255,255,.7)';cx.fill()}}else{cx.beginPath();cx.arc(f.x,f.y,r,0,7);cx.fillStyle=f.fl>0?'#fff':TC[f.t[0]];cx.fill()}
  if(!ok&&f.t[1]){cx.beginPath();cx.arc(f.x,f.y,r,.4,Math.PI+.4);cx.fillStyle=f.fl>0?'#fff':TC[f.t[1]];cx.fill()}
  if(f.ev){cx.strokeStyle='#f59e0b';cx.lineWidth=2;cx.beginPath();cx.arc(f.x,f.y,r+5,0,7);cx.stroke()}
  cx.fillStyle='#fff';cx.strokeStyle='rgba(0,0,0,.65)';cx.lineWidth=2.5;cx.font='800 9px system-ui';if(!ok){const l=f.name.slice(0,2);cx.strokeText(l,f.x,f.y+3);cx.fillText(l,f.x,f.y+3)}
  if(f.cur<f.mh){const q=Math.max(0,f.cur/f.mh);cx.fillStyle='rgba(15,23,42,.8)';cx.fillRect(f.x-12,f.y-r-9,24,3);cx.fillStyle=q>.5?'#10b981':q>.25?'#f59e0b':'#ef4444';cx.fillRect(f.x-12,f.y-r-9,24*q,3)}}
 for(const p of g.P){cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fillStyle=p.col;cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1;cx.stroke()}
 for(const p of g.PT){cx.globalAlpha=Math.max(0,p.life*3);cx.fillStyle=p.c;cx.fillRect(p.x-1.5,p.y-1.5,3,3)}cx.globalAlpha=1;
 cx.font='800 11px system-ui';for(const t of g.FT){cx.globalAlpha=Math.min(1,t.life*1.5);cx.fillStyle=t.c;cx.fillText(t.t,t.x,t.y)}cx.globalAlpha=1;
 if(g.end>0){cx.fillStyle='rgba(15,23,42,.6)';cx.fillRect(0,H/2-24,W,48);cx.fillStyle='#fff';cx.font='800 20px system-ui';cx.fillText('🏆 ¡VICTORIA DE '+g.keys[g.win].toUpperCase()+'!',W/2,H/2+7)}}
function loop(now){if(!G||!G.run)return;const raw=(now-G.last)/1000;G.last=now;step(raw);draw();if(G.run)requestAnimationFrame(loop)}

/* ===== Fin y ranking ===== */
function showRank(){let l=[];try{l=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){l=mem}
 $('rk').innerHTML=l.length?'<tr><th>#</th><th>Campeón</th><th>Tiempo</th><th>Vivos</th><th>MVP</th><th>Índice</th></tr>'+l.map((r,i)=>`<tr><td>${i+1}</td><td>${r.w}</td><td>${r.t}s</td><td>${r.s}</td><td>${r.m}</td><td><b>${r.i}</b></td></tr>`).join(''):'<tr><td>Sin registros aún</td></tr>'}
function finish(){const g=G,w=g.win,sv=g.F.filter(f=>f.alive&&f.team===w).length,tot=g.F.length,dur=+g.t.toFixed(1);
 const idx=+(dur/(Math.max(.05,sv/tot)*Math.sqrt(tot))).toFixed(2); /* índice justo */
 const tm=g.F.filter(f=>f.team===w).sort((a,b)=>b.k-a.k)[0];
 let l=[];try{l=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){l=mem}
 l.push({w:g.keys[w],t:dur,s:sv,m:tm?tm.name:'-',i:idx});l.sort((a,b)=>a.i-b.i);l=l.slice(0,8);mem=l;try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}
 $('o-t').textContent='🏆 ¡'+g.keys[w].toUpperCase()+' GANA!';
 $('o-s').textContent=`Duración ${dur}s · Sobrevivientes ${sv} · Índice justo ${idx}`;
 $('o-m').textContent=tm?`⭐ MVP: ${tm.name} (${tm.k} KO)`:'';
 showRank();$('ov').style.display='flex';[523,659,784,1046].forEach((n,i)=>setTimeout(()=>beep(n,.2),i*110))}
G={kt:[]};G=null;
</script></body></html>
